<style>
        .glass-panel {
            background: rgba(19, 27, 46, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-modal {
            background: rgba(19, 27, 46, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(173, 198, 255, 0.1);
        }

        .input-glass {
            background: rgba(11, 19, 38, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .input-glass:focus {
            border-color: #adc6ff;
            box-shadow: 0 0 10px rgba(173, 198, 255, 0.2);
            outline: none;
        }

        .btn-primary-gradient {
            background: linear-gradient(135deg, #adc6ff 0%, #d0bcff 100%);
            color: #00285d;
            transition: all 0.3s ease;
        }
        
        .btn-primary-gradient:hover {
            box-shadow: 0 0 15px rgba(208, 188, 255, 0.4);
            transform: translateY(-1px);
        }

        .modal-enter {
            animation: modalScaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes modalScaleIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen overflow-hidden font-body-md">
<!-- Background Dashboard Context (Blurred out) -->
<div class="fixed inset-0 z-0">
<iframe class="w-full h-full opacity-40 blur-sm pointer-events-none border-none" src="{{DATA:SCREEN:SCREEN_5}}"></iframe>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-margin-desktop bg-surface-container-lowest/60 backdrop-blur-md">
<!-- Modal Container -->
<div class="glass-modal w-full max-w-md rounded-xl p-8 relative modal-enter flex flex-col gap-6">
<!-- Header -->
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-1">Edit User</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Update credentials and personal details.</p>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-white/5">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="person">person</span>
<input class="input-glass w-full rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder-outline-variant bg-surface-bright" id="fullName" name="fullName" placeholder="Enter full name" type="text" value="Sarah Jenkins">
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="input-glass w-full rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder-outline-variant bg-surface-bright" id="email" name="email" placeholder="Enter email address" type="email" value="sarah.j@aether.io">
</div>
</div>
<!-- Age Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="age">Age</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="calendar_today">calendar_today</span>
<input class="input-glass w-full rounded-lg py-2.5 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder-outline-variant bg-surface-bright" id="age" name="age" placeholder="Enter age" type="number" value="28">
</div>
</div>
<!-- Actions -->
<div class="flex justify-end gap-3 mt-4 pt-4 border-t border-glass-stroke">
<button class="px-5 py-2.5 rounded-lg font-label-md text-label-md text-on-surface-variant bg-white/5 hover:bg-white/10 border border-glass-stroke transition-all duration-200" type="button">
                        Cancel
                    </button>
<button class="btn-primary-gradient px-6 py-2.5 rounded-lg font-label-md text-label-md font-bold shadow-lg" type="submit">
                        Save Changes
                    </button>
</div>
</form>
</div>
</div>


</body></html>
