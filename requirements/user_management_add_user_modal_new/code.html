<style>
        /* Glassmorphism Input Styles */
        .glass-input {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #dae2fd;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: #adc6ff;
            box-shadow: 0 0 12px rgba(173, 198, 255, 0.2);
            background: rgba(15, 23, 42, 0.6);
        }
        .glass-input::placeholder {
            color: #c2c6d6;
            opacity: 0.6;
        }
        
        /* Modal Animation */
        @keyframes modalEnter {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .animate-modal-enter {
            animation: modalEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex font-body-md antialiased relative">
<!-- Background Context (User Management Dashboard Mockup) -->
<div class="absolute inset-0 z-0 opacity-50 select-none pointer-events-none">
<img alt="Dashboard Background" class="w-full h-full object-cover blur-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuwdD4R9b_-Nm-EtTlc02iQ-d8pwKvnmxCjjjg6Fbg-ztv5UaMn9SJYLBW3tj3WPlABMGi3Fn7LXumsHuzIhGH0the95p5RbRms6Kf7Z0kYJI9EEXP7HO_EG6Wjn6zj2MdlA8VTc9BF4WhvCxrmXySybODwCEJg7D77m6xLLj4KjDFxsLhcD-joSlw5NnGjBcFz_akaGWwfSzYxA9ivMmjR0f87za43RcPl9igFL3hVqHSiU0YohaaoA">
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-4 sm:px-0">
<!-- Backdrop Blur -->
<div class="absolute inset-0 bg-background/80 backdrop-blur-md transition-opacity"></div>
<!-- Modal Container -->
<div class="relative w-full max-w-md bg-glass-bg border border-glass-stroke rounded-xl shadow-2xl animate-modal-enter overflow-hidden">
<!-- Modal Header -->
<div class="px-6 py-5 border-b border-glass-stroke flex justify-between items-center bg-surface-container-low/30">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Add New User</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none rounded-full p-1 hover:bg-white/5">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Modal Body (Form) -->
<form class="px-6 py-6 space-y-6" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md bg-surface-container text-on-surface-variant" id="fullName" placeholder="e.g. John Doe" required="" type="text">
</div>
</div>
<!-- Email Address Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">mail</span>
</div>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md bg-surface-container text-on-surface-variant" id="email" placeholder="john@example.com" required="" type="email">
</div>
</div>
<!-- Age Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="age">Age</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg font-body-md text-body-md bg-surface-container text-on-surface-variant" id="age" max="120" min="18" placeholder="25" required="" type="number">
</div>
</div>
<!-- Modal Footer (Actions) -->
<div class="pt-4 flex justify-end gap-3 border-t border-glass-stroke border-opacity-50 mt-8">
<button class="px-5 py-2.5 rounded-lg font-label-md text-label-md text-on-surface bg-surface-container hover:bg-surface-bright border border-glass-stroke transition-all duration-200" type="button">
                        Cancel
                    </button>
<button class="px-5 py-2.5 rounded-lg font-label-md text-label-md text-surface bg-gradient-to-r from-primary to-secondary hover:shadow-[0_0_15px_rgba(173,198,255,0.4)] transition-all duration-300" type="submit">
                        Add User
                    </button>
</div>
</form>
</div>
</div>
</body></html>
